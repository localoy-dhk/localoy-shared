name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generated:
    name: generated files are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Regenerate from enums.json
        run: python generate.py

      - name: Fail if the working tree is dirty
        run: |
          if ! git diff --quiet --exit-code; then
            echo "::error::Generated files are out of date or were hand-edited."
            echo "Run 'python generate.py' locally and commit the result."
            git --no-pager diff
            exit 1
          fi
          echo "Generated files match enums.json + VERSION."

      - name: Generator tests
        run: |
          pip install --quiet pytest
          python -m pytest tests -q

  build:
    name: build both packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build the Python package
        run: |
          pip install --quiet build
          python -m build python/

      - name: Import smoke test
        run: |
          pip install --quiet ./python
          python -c "import localoy_shared; print(localoy_shared.__version__, list(localoy_shared.__all__))"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: js/package-lock.json

      - name: Build the JS package
        working-directory: js
        run: |
          npm ci
          npm run build

  semver:
    name: semver advice
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Extract the base revision
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git show "$BASE_SHA:enums.json" > /tmp/base-enums.json 2>/dev/null || echo '{}' > /tmp/base-enums.json
          git show "$BASE_SHA:VERSION"    > /tmp/base-VERSION   2>/dev/null || echo '0.0.0' > /tmp/base-VERSION

      - name: Classify the change
        id: semver
        run: |
          python scripts/semver_check.py \
            --base-enums /tmp/base-enums.json --head-enums enums.json \
            --base-version /tmp/base-VERSION  --head-version VERSION \
            --markdown /tmp/semver-report.md

      - name: Comment on the PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/semver-report.md', 'utf8');
            const marker = '<!-- localoy-shared-semver -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find(
              (c) => c.user.type === 'Bot' && c.body.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
